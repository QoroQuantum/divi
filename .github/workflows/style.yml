name: Style Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-divi
        with:
          python-version: "3.13"
          # Explicit extras, not ``--all-extras --no-extra ai``: the ``all``
          # extra re-includes ``ai`` transitively, so the exclusion is a no-op.
          # pyrefly type-checks all of ``divi/`` except ``divi/ai``.
          sync-args: --group dev --extra chem --extra aer --extra qubo-decompose

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        env:
          SKIP: insert-license
        run: uv run pre-commit run --all-files --show-diff-on-failure
