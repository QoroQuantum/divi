repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-docstring-first
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace

-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf  # Forbid files containing CRLF end-lines to be committed
      - id: remove-crlf  # Replace CRLF end-lines by LF ones before committing
      - id: forbid-tabs  # Forbid files containing tabs to be committed
      - id: remove-tabs  # Replace tabs by whitespaces before committing
        args: ["--whitespaces-count", "2"]
      - id: chmod
        args: ["644"]
        files: '\.md$'
      - id: insert-license
        files: '\.py$'
        exclude: '^(docs/)'
        args:
          - --license-filepath
          - LICENSES/.license-header
          - --use-current-year
          - --no-extra-eol

-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

-   repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: pyrefly-check
        name: pyrefly type check
        entry: uv run --locked pyrefly check
        language: system
        pass_filenames: false
      - id: tutorials-ci-dry-run
        name: tutorials ci runner dry-run
        entry: python -m tutorials._ci_runner --dry-run
        language: system
        files: '^tutorials/'
        pass_filenames: false
